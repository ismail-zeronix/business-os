# Local development database for Zeronix Intelligence.
# Isolated on purpose: own compose project, container, volume and host port. See docs/decisions/0003-local-postgres-isolation.md
#
#   npm run db:up      start (waits until healthy)
#   npm run db:down    stop (the volume, and therefore your data, is kept)
#
# Data lives in the named volume `zeronix_bi_pgdata`. `docker compose down -v` DELETES it. Do not run that on data that matters.

name: zeronix-bi

services:
  db:
    image: postgres:17 # Debian-based on purpose (not alpine): keeps a later move to pgvector/pgvector:pg17 collation-safe
    container_name: zeronix-bi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ZI_DB_USER:-zeronix_bi}
      POSTGRES_PASSWORD: ${ZI_DB_PASSWORD:-zeronix_bi_dev} # local-only default; never reuse for anything real
      POSTGRES_DB: ${ZI_DB_NAME:-zeronix_bi}
      TZ: UTC
    ports:
      # Loopback only. Not reachable from other machines.
      - "127.0.0.1:${ZI_DB_PORT:-5442}:5432"
    volumes:
      - zeronix_bi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  zeronix_bi_pgdata:
    name: zeronix_bi_pgdata
